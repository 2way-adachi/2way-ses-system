<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2way Manage system SES画面モック | 2way-ses-system</title>
<style>
:root{
  --primary:#1e5eb8; --primary-dark:#17488d; --primary-soft:#e8f0fb;
  --bg:#f4f6f9; --surface:#fff; --fg:#1f2328; --fg-muted:#5b6673;
  --border:#dfe3e8; --border-strong:#c4cbd4;
  --ok:#1a7f4b; --ok-soft:#e4f4ea; --warn:#a15c00; --warn-soft:#fdf3e2;
  --danger:#b3261e; --danger-soft:#fceceb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --shadow-lg:0 4px 12px rgba(16,24,40,.1);
  --radius:8px; --header-h:56px; --sidebar-w:232px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-size:14px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}

/* ---------- mock banner ---------- */
.mockbar{
  background:#2b3441;color:#e9edf2;font-size:12.5px;padding:.45rem 1rem;
  display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;
}
.mockbar strong{color:#ffd66b}
.mockbar a{color:#8fc0ff}

/* ---------- header ---------- */
header.appbar{
  position:sticky;top:0;z-index:30;height:var(--header-h);
  background:var(--primary);color:#fff;display:flex;align-items:center;
  padding:0 1.25rem;gap:1rem;box-shadow:var(--shadow);
}
.appbar .logo{font-weight:700;font-size:15.5px;letter-spacing:.02em;white-space:nowrap}
.appbar .logo span{opacity:.75;font-weight:400;font-size:12.5px;margin-left:.5rem}
.appbar .spacer{flex:1}
.appbar .user{display:flex;align-items:center;gap:.55rem;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - var(--header-h))}
nav.side{background:var(--surface);border-right:1px solid var(--border);padding:.85rem 0}
.side .grp{padding:.55rem 1.15rem .3rem;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--fg-muted)}
.side a.item{
  display:flex;align-items:center;gap:.65rem;padding:.55rem 1.15rem;
  color:var(--fg);text-decoration:none;font-size:13.5px;border-left:3px solid transparent;
}
.side a.item:hover{background:var(--bg)}
.side a.item.active{background:var(--primary-soft);border-left-color:var(--primary);color:var(--primary-dark);font-weight:600}
.side a.item.disabled{color:#a6aeb8;pointer-events:none}
.side .ico{width:18px;text-align:center;font-size:15px}
.side .badge{margin-left:auto;font-size:10.5px;background:var(--bg);border:1px solid var(--border);
  color:var(--fg-muted);padding:.05rem .4rem;border-radius:999px}

main{padding:1.25rem 1.75rem 4rem;min-width:0}
.crumb{font-size:12.5px;color:var(--fg-muted);margin-bottom:.7rem}
.crumb a{color:var(--fg-muted);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb span{margin:0 .4rem;opacity:.5}

.pagehead{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.15rem;flex-wrap:wrap}
.pagehead h1{font-size:20px;margin:0;line-height:1.4}
.pagehead .sub{font-size:12.5px;color:var(--fg-muted);margin:.15rem 0 0}
.pagehead .acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);
  padding:.42rem .9rem;border-radius:6px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:.4rem;transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--danger);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--danger-soft)}
.linklike{border:0;background:transparent;padding:0;color:var(--primary);font:inherit;font-weight:inherit;cursor:pointer;text-align:left}
.linklike:hover{text-decoration:underline}
.btn.sm{padding:.22rem .55rem;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:1.15rem;overflow:hidden}
.card>.hd{padding:.75rem 1.1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;background:#fafbfc}
.card>.hd h2{font-size:14px;margin:0;font-weight:700}
.card>.hd .acts{margin-left:auto;display:flex;gap:.4rem}
.card>.bd{padding:1.1rem}
.card>.bd.flush{padding:0}

/* ---------- filter bar ---------- */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.detail-filter{margin-top:.65rem;padding-top:.85rem;border-top:1px solid var(--border)}
.detail-filter-grid{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:.75rem}
.filter-toggle{margin-top:.6rem}
.mail-import-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;width:100%}
.mail-import-buttons,.mail-import-latest{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.mail-import-latest{justify-content:flex-end;margin-left:auto;text-align:right}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field label{font-size:11.5px;color:var(--fg-muted);font-weight:600}
.ctl{
  border:1px solid var(--border-strong);border-radius:6px;padding:.4rem .6rem;
  background:var(--surface);font-size:13px;min-width:150px;
}
.ctl:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.ctl.invalid{border-color:var(--danger);outline:2px solid var(--danger-soft);background:var(--danger-soft)}
textarea.ctl{min-height:110px;resize:vertical;width:100%;line-height:1.7}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:.6rem .85rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl th{background:#fafbfc;font-size:11.5px;color:var(--fg-muted);font-weight:700;
  letter-spacing:.03em;white-space:nowrap;position:sticky;top:0}
table.tbl tbody tr:hover{background:var(--primary-soft)}
table.tbl tbody tr{cursor:pointer}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.location-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;line-height:1.5;max-width:260px}
.comparison-table .comparison-group{width:86px;font-weight:700;vertical-align:top;padding-top:.8rem;box-shadow:inset 3px 0 var(--border-strong)}
.comparison-table .comparison-group.skills{background:var(--primary-soft);color:var(--primary-dark);box-shadow:inset 3px 0 var(--primary)}
.comparison-table .comparison-group.conditions{background:#f6f7f9;color:var(--fg-muted)}
.comparison-table .comparison-subitem{padding-left:1.15rem;font-weight:600}
.comparison-table tr.comparison-section-start>*{border-top:2px solid var(--border-strong)}
.who{display:flex;align-items:center;gap:.6rem}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.who .nm{font-weight:600}
.who .kn{font-size:11px;color:var(--fg-muted);line-height:1.3}
.member-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.member-card{border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;min-height:188px;transition:.12s}
.member-card:hover{box-shadow:0 3px 8px rgba(0,0,0,.16);transform:translateY(-1px)}
.member-card .mc-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px}
.member-card .mc-name{font-size:16px;font-weight:500;line-height:1.35}
.member-card .mc-type{font-size:12px;color:var(--fg-muted);margin-top:3px}
.member-card .mc-status{margin-left:auto}
.member-card .mc-body{padding:4px 16px 16px}
.member-card .mc-meta{font-size:12.5px;color:var(--fg-muted);line-height:1.75}
@media (max-width:1100px){.member-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.member-grid{grid-template-columns:1fr}}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;padding:.1rem .55rem;
  border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--fg-muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:#b7e0c6;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:#eccb95;color:var(--warn)}
.chip.pri{background:var(--primary-soft);border-color:#bcd5f2;color:var(--primary-dark)}
.taglist{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font-size:12px;padding:.15rem .6rem;border-radius:5px;background:var(--primary-soft);
  color:var(--primary-dark);border:1px solid #cfe0f6;white-space:nowrap}
.tag .yr{opacity:.7;font-size:11px;margin-left:.25rem}
.tag.gray{background:var(--bg);border-color:var(--border);color:var(--fg-muted)}

/* ---------- definition grid ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 1.5rem}
.dl .row{display:grid;grid-template-columns:8.5rem 1fr;gap:.5rem;padding:.42rem 0;border-bottom:1px dashed var(--border);font-size:13px}
.dl .row dt{color:var(--fg-muted);font-size:12px;margin:0}
.dl .row dd{margin:0;word-break:break-word}
.calc{font-size:10.5px;color:var(--ok);background:var(--ok-soft);border:1px solid #b7e0c6;
  padding:0 .3rem;border-radius:3px;margin-left:.35rem;vertical-align:1px}

/* ---------- career ---------- */
.career{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.9rem;background:var(--surface)}
.career>.top{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;background:#fafbfc;border-bottom:1px solid var(--border);flex-wrap:wrap}
.career .no{width:22px;height:22px;border-radius:5px;background:var(--primary);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.career .term{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--fg-muted);white-space:nowrap}
.career .pjname{font-weight:700;font-size:13.5px}
.career .top .acts{margin-left:auto;display:flex;gap:.3rem}
.career>.bd{padding:.85rem .9rem}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:.15rem;border-bottom:1px solid var(--border);margin-bottom:1.15rem;overflow-x:auto}
.tabs button{
  border:none;background:none;padding:.65rem 1.1rem;font-size:13.5px;color:var(--fg-muted);
  border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;
}
.tabs button:hover{color:var(--fg);background:var(--bg)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:.5rem;font-size:12.5px;color:var(--fg-muted)}
.step .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface)}
.step.active{color:var(--primary-dark);font-weight:700}
.step.active .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done{color:var(--ok)}
.stepline{flex:1;height:1px;background:var(--border-strong);min-width:18px;max-width:56px}

.drop{
  border:2px dashed var(--border-strong);border-radius:var(--radius);padding:2.4rem 1rem;
  text-align:center;background:#fafbfc;color:var(--fg-muted);
}
.drop .big{font-size:28px;margin-bottom:.4rem}
.drop strong{color:var(--fg)}

/* ---------- notes ---------- */
.note{border-radius:6px;padding:.65rem .9rem;font-size:12.5px;margin-bottom:1rem;border:1px solid}
.note.info{background:var(--primary-soft);border-color:#bcd5f2;color:var(--primary-dark)}
.note.warn{background:var(--warn-soft);border-color:#eccb95;color:var(--warn)}
.note p{margin:0}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--fg-muted);font-size:13px}
.pager{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.1rem;font-size:12.5px;color:var(--fg-muted);border-top:1px solid var(--border)}
.pager .spacer{flex:1}
.pager select{min-width:76px}
.mail-frame{border:1px solid var(--border);border-radius:4px;background:#fff;margin-bottom:16px;overflow:hidden}
.mail-frame-title{padding:10px 14px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.mail-frame-scroll{max-height:300px;overflow:auto;padding:8px}
.mail-choice{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px;border-radius:4px;cursor:pointer}
.mail-choice:hover,.mail-choice.selected{background:rgba(63,81,181,.08)}
.mail-subject{word-break:break-word;margin:4px 0}
.duplicate-badge{margin-left:4px}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.85;margin:0}
.source-mail-actions{margin-top:14px}
.source-mail-meta{display:flex;flex-direction:column;gap:.8rem}
.source-mail-meta .row{display:flex;flex-direction:column;gap:.18rem;padding:0;border-bottom:0}
.source-mail-body-section{margin-top:12px;padding-top:14px;border-top:1px solid var(--border)}
.source-mail-body{white-space:pre-wrap;font-size:13px;line-height:1.85;overflow-wrap:anywhere;position:relative}
.source-mail-body.collapsed{max-height:240px;overflow:hidden}
.source-mail-body.collapsed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.source-mail-toggle{margin-top:10px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);
  background:#2b3441;color:#fff;padding:.6rem 1.1rem;border-radius:6px;font-size:13px;
  box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hidden{display:none !important}
.skill-sheet-print{display:none}
@media print{
  .skill-sheet-print{display:block;color:#000;font-family:'BIZ UDPGothic','Segoe UI',sans-serif;padding:10mm;font-size:9.5px}
  body.printing>*:not(#printSheet){display:none !important}
  .skill-sheet-print h1{text-align:center;color:#1f4e96;letter-spacing:.2em;font-size:20px;margin:0 0 8px}
  .skill-sheet-print h2{text-align:center;color:#1f4e96;font-size:14px;margin:12px 0 4px}
  .skill-sheet-print table{width:100%;border-collapse:collapse;table-layout:fixed}
  .skill-sheet-print th,.skill-sheet-print td{border:1px solid #000;padding:4px;vertical-align:top;word-break:break-word}
  .skill-sheet-print th{background:#4472c4;text-align:center}
  .skill-sheet-print .print-meta td{height:22px}
  .skill-sheet-print .print-career{page-break-inside:avoid}
  .skill-sheet-print .print-pr{border:1px solid #000;min-height:70px;padding:6px;white-space:pre-wrap}
}
.ses-list{display:flex;flex-direction:column}
.ses-row{
  display:grid;grid-template-columns:minmax(260px,1.6fr) minmax(180px,1fr) 120px minmax(120px,.65fr) minmax(110px,.6fr);
  gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;background:#fff;
}
.ses-row.proposal{grid-template-columns:minmax(260px,1.6fr) minmax(180px,1fr) 120px 96px 140px minmax(120px,.7fr)}
.ses-row:hover{background:var(--primary-soft)}
.ses-head{font-size:12px;color:var(--fg-muted);font-weight:700;background:#fafbfc;cursor:default}
.ses-head:hover{background:#fafbfc}
.ses-title{font-weight:700;line-height:1.45}
.ses-sub{font-size:12px;color:var(--fg-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-tech{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses-score{font-weight:700;color:var(--primary-dark)}
.member-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 16px;overflow-x:auto}
.member-tabs button{border:0;background:transparent;padding:12px 18px;color:var(--fg-muted);font:inherit;white-space:nowrap}
.member-tabs button.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:700}
.member-tabs button:hover{background:var(--bg)}
.timeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timeline .step{margin:0}
.proposal-stepper{display:grid;grid-template-columns:repeat(6,1fr);margin:10px 0 18px;overflow:hidden}
.proposal-step{position:relative;text-align:center;padding-top:36px;font-size:12px;color:var(--fg-muted);min-width:0}
.proposal-step:before{content:"";position:absolute;top:15px;left:0;right:0;height:1px;background:#bdbdbd}
.proposal-step:first-child:before{left:50%}.proposal-step:last-child:before{right:50%}
.proposal-step .circle{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#9e9e9e;color:#fff;font-size:12px;z-index:1}
.proposal-step.done .circle,.proposal-step.active .circle{background:var(--primary)}
.proposal-step.active{color:var(--fg);font-weight:500}
.proposal-detail-grid{display:grid;grid-template-columns:5fr 7fr;gap:16px}
.proposal-info{background:#f5f5f5;border-radius:4px;padding:16px;height:100%}
.proposal-info .info-row{margin-bottom:10px}.proposal-info .info-label{display:block;font-size:11px;color:var(--fg-muted);margin-bottom:2px}
.proposal-form{display:flex;flex-direction:column;gap:12px}.proposal-form .field{min-width:0}
.snapshot{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1300;display:grid;place-items:center;padding:24px}
.dialog-panel{background:#fff;border-radius:4px;box-shadow:var(--shadow-lg);width:min(1120px,96vw);max-height:88vh;overflow:auto}
.dialog-title{padding:18px 24px;font-size:20px;border-bottom:1px solid var(--border)}
.dialog-content{padding:20px 24px}.dialog-actions{padding:10px 24px 18px;display:flex;justify-content:flex-end}
@media (max-width:980px){
  .ses-row,.ses-row.proposal{grid-template-columns:1fr 1fr}
  .ses-head{display:none}
  .mail-detail-grid{grid-template-columns:1fr !important}
  .proposal-detail-grid{grid-template-columns:1fr}
  .detail-filter-grid{grid-template-columns:repeat(2,minmax(145px,1fr))}
}
@media (max-width:620px){.detail-filter-grid{grid-template-columns:1fr}}
@media (max-width:700px){.proposal-stepper{grid-template-columns:1fr}.proposal-step{padding:8px 8px 8px 38px;text-align:left}.proposal-step:before{display:none}.proposal-step .circle{left:14px;top:4px;transform:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:.4rem}
  .side .grp{display:none}
  .side a.item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:.5rem .8rem}
  .side a.item.active{border-left:none;border-bottom-color:var(--primary)}
  .side .badge{display:none}
  main{padding:1rem}
}
@media print{
  .mockbar,header.appbar,nav.side,.pagehead .acts,.crumb,.card>.hd .acts{display:none !important}
  .shell{grid-template-columns:1fr}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

/* ---------- Lavender / Material-UI preview theme ---------- */
:root{
  --primary:#3f51b5; --primary-dark:#303f9f; --primary-soft:#eef0fb;
  --bg:#fafafa; --surface:#fff; --fg:#222; --fg-muted:#666;
  --border:#e0e0e0; --border-strong:#bdbdbd;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24);
  --shadow-lg:0 4px 12px rgba(0,0,0,.18);
  --radius:4px; --header-h:64px; --sidebar-w:240px;
}
body{
  background:var(--bg);
  font-family:'BIZ UDPGothic','Yu Gothic',YuGothic,'Hiragino Kaku Gothic Pro',Meiryo,Osaka,'MS PGothic',sans-serif;
}
.mockbar{display:none}
header.appbar{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:1201;
  background:var(--primary);padding:0 24px;box-shadow:0 2px 4px rgba(0,0,0,.2);
}

const PAGE_SIZE_OPTIONS = [50,100,200,500];
function activeFilterLabel(count){ return `詳細条件${count ? `（${count}件指定中）` : ""}`; }
function duplicateBadge(count){ return count > 1 ? `<span class="chip duplicate-badge">重複${count}件</span>` : ""; }
function pageSlice(rows,state){
  const size = Number(state.size)||100;
  const pages = Math.max(1,Math.ceil(rows.length/size));
  state.page = Math.min(Math.max(1,Number(state.page)||1),pages);
  return rows.slice((state.page-1)*size,state.page*size);
}
function pagerHtml(count,state,key){
  const size=Number(state.size)||100, page=Math.max(1,Number(state.page)||1), start=count?((page-1)*size+1):0, end=Math.min(count,page*size);
  return `<div class="pager"><span>1ページの表示数:</span><select class="ctl" data-page-size="${key}">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}"${size===n?" selected":""}>${n}</option>`).join("")}</select><div class="spacer"></div><span>${start}–${end} / ${count}</span><button class="btn sm" data-page-prev="${key}"${page<=1?" disabled":""}>‹</button><button class="btn sm" data-page-next="${key}"${end>=count?" disabled":""}>›</button></div>`;
}
function bindPager(state,key,render){
  const size=main.querySelector(`[data-page-size="${key}"]`),prev=main.querySelector(`[data-page-prev="${key}"]`),next=main.querySelector(`[data-page-next="${key}"]`);
  if(size) size.onchange=e=>{state.size=Number(e.target.value);state.page=1;render();};
  if(prev) prev.onclick=()=>{state.page=Math.max(1,state.page-1);render();};
  if(next) next.onclick=()=>{state.page+=1;render();};
}

/* 要件: 年齢はDBに保存せず生年月日から算出する */
function calcAge(birth){
  const b = new Date(normalizeDateValue(birth)), t = new Date("2026-08-03");
  if(Number.isNaN(b.getTime())) return "—";
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function ageText(birth){
  const a = calcAge(birth);
  return a === "—" ? "—" : `${a}歳`;
}
function months2y(m){
  const y = Math.floor(m/12), r = m%12;
  return r ? `${y}年${r}ヶ月` : `${y}年`;
}
function y2months(v){
  const s = toHalfWidth(v);
  const ym = s.match(/(\d+)\s*年(?:\s*(\d+)\s*ヶ?月)?/);
  if(ym) return (+ym[1] * 12) + (+(ym[2] || 0));
  const n = s.match(/\d+/);
  return n ? +n[0] : 0;
}
/* 経験年数: 最も古い職歴の開始からの通算 */
function totalYears(s){
  if(!s.careers.length) return "—";
  const oldest = s.careers.map(c=>c.start).sort()[0];
  const [y,m] = oldest.split("-").map(Number);
  const mm = (2026 - y) * 12 + (8 - m);
  return months2y(mm);
}
function topSkills(s, n=3){ return s.skills.slice(0,n).map(k=>k.name); }
function initial(name){ return name.replace(/\s/g,"").charAt(0); }
function term(c){ return `${c.start} 〜 ${c.current ? "現在" : c.end}`; }
function normalizeDateValue(v){ return String(v || "").replace(/\//g, "-"); }
function toHalfWidth(s){
  return String(s || "")
    .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ");
}
function formatDateValue(v, kind){
  const s = toHalfWidth(v);
  const digits = s.replace(/\D/g, "");
  if(digits.length){
    const max = kind === "month" ? 6 : 8;
    const d = digits.slice(0, max);
    if(kind === "month"){
      if(d.length <= 4) return d;
      return `${d.slice(0,4)}-${d.slice(4,6)}`;
    }
    if(d.length <= 4) return d;
    if(d.length <= 6) return `${d.slice(0,4)}-${d.slice(4)}`;
    return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
  }
  return s.replace(/\//g, "-");
}
function dateInputAttrs(kind){
  const ph = kind === "month" ? "例: 2026-04" : "例: 1990-04-12";
  const max = kind === "month" ? 7 : 10;
  return `type="text" inputmode="numeric" autocomplete="off" maxlength="${max}" data-date-format="${kind}" placeholder="${ph}"`;
}
function validateDateValue(v, kind){
  const s = normalizeDateValue(v);
  if(!s) return {ok:true, complete:false};
  if(kind === "month"){
    const m = s.match(/^(\d{4})-(\d{2})$/);
    if(!m) return {ok:true, complete:false};
    const month = +m[2];
    return month >= 1 && month <= 12
      ? {ok:true, complete:true}
      : {ok:false, complete:true, message:"月は01〜12で入力してください"};
  }
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return {ok:true, complete:false};
  const y = +m[1], month = +m[2], day = +m[3];
  const d = new Date(y, month - 1, day);
  const ok = d.getFullYear() === y && d.getMonth() === month - 1 && d.getDate() === day;
  return ok
    ? {ok:true, complete:true}
    : {ok:false, complete:true, message:"存在する日付を入力してください"};
}
function careerDatePairError(el){
  const row = el.closest(".career");
  if(!row) return null;
  const start = row.querySelector('[data-bind$=".start"]');
  const end = row.querySelector("[data-career-end]");
  if(!start || !end || !start.value || !end.value) return null;
  const sv = validateDateValue(start.value, "month");
  const ev = validateDateValue(end.value, "month");
  if(!sv.ok || !ev.ok || !sv.complete || !ev.complete) return null;
  return normalizeDateValue(start.value) <= normalizeDateValue(end.value)
    ? null
    : {message:"開始年月は終了年月以前で入力してください", fields:[start,end]};
}

const STORAGE_KEY = "2way-ses-system.skillSheets.v1";
const DRAFT_STORAGE_KEY = "2way-ses-system.skillSheetDrafts.v1";
function loadStoredSheets(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(Array.isArray(saved)) SHEETS.splice(0, SHEETS.length, ...saved);
  }catch(e){ console.warn("保存データを読み込めませんでした", e); }
}
function persistSheets(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(SHEETS));
  $("#navCount").textContent = SHEETS.length;
}
function loadDrafts(){
  try{return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "{}");}catch(e){return {};}
}
function saveDraftState(state){
  if(!state || !state.id) return;
  const drafts = loadDrafts();
  const copy = JSON.parse(JSON.stringify(state));
  delete copy._mode;
  drafts[String(state.id)] = {savedAt:nowMinuteString(), content:copy};
  localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
}
function getDraftState(id){ return loadDrafts()[String(id)] || null; }
function deleteDraftState(id){
  const drafts = loadDrafts();
  delete drafts[String(id)];
  localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
}
function nowMinuteString(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function setPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}
function fieldValue(el){
  if(el.dataset.dateFormat) return normalizeDateValue(el.value);
  if(el.dataset.employeeCode) return toHalfWidth(el.value).replace(/[^0-9]/g, "").slice(0, 4);
  if(el.type === "number") return Number(el.value || 0);
  return el.value;
}
function syncEditState(){
  if(!editState) return;
  main.querySelectorAll("[data-bind]").forEach(el=>{
    const path = el.dataset.bind;
    let v = fieldValue(el);
    if(path.endsWith(".attendanceSubmissionSource")) v = attendanceSourceValue(v);
    setPath(editState, path, v);
  });
  main.querySelectorAll("[data-skill]").forEach(el=>{
    const k = editState.skills[+el.dataset.skill], f = el.dataset.skillField;
    if(!k) return;
    if(f === "months") k.months = y2months(el.value);
    else if(f === "last") k.last = normalizeDateValue(el.value);
    else k[f] = el.value;
  });
  main.querySelectorAll("[data-qual]").forEach(el=>{
    const q = editState.quals[+el.dataset.qual], f = el.dataset.qualField;
    if(!q) return;
    q[f] = f === "date" ? normalizeDateValue(el.value) : el.value;
  });
}
function validateEditForm(){
  main.querySelectorAll(".ctl.invalid").forEach(el=>el.classList.remove("invalid"));
  const invalid = [...main.querySelectorAll("[data-date-format]")].find(el=>{
    const v = validateDateValue(el.value, el.dataset.dateFormat);
    return v.complete && !v.ok;
  });
  if(invalid){
    invalid.classList.add("invalid");
    invalid.focus();
    toast(validateDateValue(invalid.value, invalid.dataset.dateFormat).message);
    return false;
  }
  const pairError = [...main.querySelectorAll(".career")].map(row=>careerDatePairError(row.querySelector("[data-career-end]") || row)).find(Boolean);
  if(pairError){
    pairError.fields.forEach(el=>el.classList.add("invalid"));
    pairError.fields[0].focus();
    toast(pairError.message);
    return false;
  }
  return true;
}
function nextSheetId(){
  return Math.max(0, ...SHEETS.map(s=>s.id||0)) + 1;
}
function statusFromCareers(careers){
  const current = careers.find(c=>c.current);
  if(current) return current.end ? "稼働中（終了予定あり）" : "稼働中";
  return "待機中";
}
function saveEditState(status){
  if(!validateEditForm()) return;
  syncEditState();
  editState.status = status;
  editState.empStatus = statusFromCareers(editState.careers);
  editState.updated = nowMinuteString();
  if(status === "下書き"){
    saveDraftState(editState);
    toast(`下書きを保存しました（${editState.updated}）`);
    return;
  }
  const saved = JSON.parse(JSON.stringify(editState));
  delete saved._mode;
  if(!saved.id){
    saved.id = nextSheetId();
    SHEETS.unshift(saved);
  }else{
    const idx = SHEETS.findIndex(s=>s.id===saved.id);
    if(idx >= 0) SHEETS[idx] = saved;
    else SHEETS.unshift(saved);
  }
  deleteDraftState(saved.id);
  persistSheets();
  toast(status === "下書き" ? "下書き保存しました" : "保存しました");
  screenDetail(saved.id);
}
function scheduleDraftSave(){
  if(!editState || !editState.id) return;
  clearTimeout(editState._draftTimer);
  editState._draftTimer = setTimeout(()=>{
    syncEditState();
    saveDraftState(editState);
    toast(`下書きを自動保存しました（${nowMinuteString()}）`);
  }, 900);
}

let editState = null, editTab = "skill";

function screenEdit(id, mode){
  const src = id ? SHEETS.find(x=>x.id===id) : null;
  editState = src ? JSON.parse(JSON.stringify(src)) : {
    id:null, code:"", name:"", kana:"", gender:"", birth:"", pref:"", city:"", station:"",
    education:"", empStatus:"待機中", price:"", prefLoc:"", remote:"", intention:"",
    updated:"2026-08-03", status:"下書き", skills:[], quals:[], careers:[], pr:""
  };
  if(mode === "dup"){ editState.id = null; editState.code = ""; editState.name = src.name + "（複製）"; }
  editState._mode = mode || (id ? "edit" : "new");
  editTab = "skill";
  const draft = id ? getDraftState(id) : null;
  if(draft && confirm(`保存されていない下書きがあります（${draft.savedAt}）。復元しますか？`)){
    editState = {...editState, ...draft.content, _mode:editState._mode};
    toast("下書きを復元しました");
  }
  renderEdit();
}

function renderEdit(){
  const e = editState;
  const title = e._mode==="new" ? "スキルシート新規作成"
              : e._mode==="dup" ? "スキルシート複製" : "スキルシート編集";
  main.innerHTML = `
  ${crumb([{label:"ホーム"},{label:"メンバー一覧",nav:"members"},{label:title}])}
  <div class="pagehead">
    <div><h1>${esc(title)}</h1><p class="sub">${e.name?esc(e.name):"新規レコード"}${e.code?"／"+esc(e.code):""}</p></div>
    <div class="acts">
      <button class="btn" data-nav="members">キャンセル</button>
      <button class="btn primary" id="saveBtn">保存する</button>

  </div>

  <div class="tabs">
    <button data-tab="skill" class="${editTab==="skill"?"active":""}">スキル・資格</button>
    <button data-tab="career" class="${editTab==="career"?"active":""}">経歴 <span class="chip">${e.careers.length}</span></button>
    <button data-tab="pr" class="${editTab==="pr"?"active":""}">自己PR</button>
  </div>
  <div id="tabBody"></div>`;

  document.querySelectorAll(".tabs button").forEach(b=>{

function fld(label, val, opt){
  opt = opt || {};
  const w = opt.wide ? "grid-column:1/-1;" : "";
  const bind = opt.bind ? ` data-bind="${esc(opt.bind)}"` : "";
  if(opt.type === "textarea")
    return `<div class="field" style="${w}"><label>${esc(label)}</label><textarea class="ctl"${bind}>${esc(val)}</textarea></div>`;
  if(opt.type === "select")
    return `<div class="field" style="${w}"><label>${esc(label)}</label><select class="ctl" style="width:100%"${bind}>
      ${opt.options.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  if(opt.type === "date" || opt.type === "month")
    return `<div class="field" style="${w}"><label>${esc(label)}</label>
    <input class="ctl" style="width:100%"${bind} ${dateInputAttrs(opt.type)} value="${esc(formatDateValue(val, opt.type))}"></div>`;
  return `<div class="field" style="${w}"><label>${esc(label)}</label>
    <input class="ctl" style="width:100%"${bind} type="${opt.type||"text"}" value="${esc(val)}" placeholder="${esc(opt.ph||"")}" ${opt.halfwidth ? 'data-halfwidth="true"' : ""} ${opt.employeeCode ? 'data-employee-code="true"' : ""}></div>`;
}

                ${["言語","FW","DB","OS","インフラ","ツール"].map(c=>`<option${c===k.cat?" selected":""}>${c}</option>`).join("")}</select></td>
              <td><input class="ctl" style="width:100%;min-width:0" data-skill="${i}" data-skill-field="months" value="${months2y(k.months)}"></td>
              <td><input class="ctl" style="width:100%;min-width:0" data-skill="${i}" data-skill-field="last" ${dateInputAttrs("month")} value="${esc(formatDateValue(k.last, "month"))}"></td>
              <td><input class="ctl" style="width:100%;min-width:0" data-skill="${i}" data-skill-field="note" value="${esc(k.note||"")}" placeholder="—"></td>
              <td><button class="btn sm danger" data-delskill="${i}">削除</button></td>
            </tr>`).join("") : `<tr><td colspan="7"><div class="empty">スキルが登録されていません。</div></td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h2>資格</h2><div class="acts"><button class="btn sm primary" id="addQual">＋ 資格を追加</button></div></div>
      <div class="bd flush">
        <div class="tbl-scroll"><table class="tbl">
          <thead><tr><th style="width:3rem">順</th><th>資格名</th><th style="width:10rem">取得年月</th><th>備考</th><th style="width:5rem"></th></tr></thead>
          <tbody>${e.quals.length ? e.quals.map((q,i)=>`
            <tr style="cursor:default">
              <td class="num">${i+1}</td>
              <td><input class="ctl" style="width:100%;min-width:0" data-qual="${i}" data-qual-field="name" value="${esc(q.name)}"></td>
              <td><input class="ctl" style="width:100%;min-width:0" data-qual="${i}" data-qual-field="date" ${dateInputAttrs("month")} value="${esc(formatDateValue(q.date, "month"))}"></td>
              <td><input class="ctl" style="width:100%;min-width:0" data-qual="${i}" data-qual-field="note" value="${esc(q.note)}" placeholder="—"></td>
              <td><button class="btn sm danger" data-delqual="${i}">削除</button></td>
            </tr>`).join("") : `<tr><td colspan="5"><div class="empty">資格が登録されていません。</div></td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>`;

    $("#addSkill").onclick = () => { syncEditState(); e.skills.push({name:"",cat:"言語",months:0,last:"",note:""}); renderTab(); };
    $("#addQual").onclick  = () => { syncEditState(); e.quals.push({name:"",date:"",note:""}); renderTab(); };
    body.querySelectorAll("[data-delskill]").forEach(b=>b.onclick=()=>{ syncEditState(); e.skills.splice(+b.dataset.delskill,1); renderTab(); });
    body.querySelectorAll("[data-delqual]").forEach(b=>b.onclick=()=>{ syncEditState(); e.quals.splice(+b.dataset.delqual,1); renderTab(); });
    return;
  }

  if(editTab === "career"){
    body.innerHTML = `
    <div class="pagehead" style="margin-bottom:.8rem">
      <div><h1 style="font-size:15px">経歴 ${e.careers.length} 件</h1></div>
      <div class="acts"><button class="btn" id="addCareer">＋ 経歴を追加（経験者）</button><button class="btn" id="addCareerInexperienced">＋ 経歴を追加（未経験）</button></div>
    </div>
    ${e.careers.length ? e.careers.map((c,i)=>`
      <div class="career">
        <div class="top">
          <div class="no">${i+1}</div>
          <div class="pjname">${esc(c.project) || "（プロジェクト名未入力）"}</div>
          ${c.current?'<span class="chip ok">現在参画中</span>':""}
          <div class="acts">
            <button class="btn sm" data-up="${i}" ${i===0?"disabled":""}>↑</button>
            <button class="btn sm" data-down="${i}" ${i===e.careers.length-1?"disabled":""}>↓</button>
            <button class="btn sm" data-dupc="${i}">⧉ 複製</button>
            <button class="btn sm danger" data-delc="${i}">削除</button>
          </div>
        </div>
        <div class="bd">
          <div style="${GRID}">
            ${fld("開始年月", c.start, {type:"month", bind:`careers.${i}.start`})}
            <div class="field"><label>終了年月</label>
              <input class="ctl" style="width:100%" data-career-end="${i}" ${dateInputAttrs("month")} value="${esc(formatDateValue(c.end || "", "month"))}">
              <label style="display:flex;gap:.35rem;align-items:center;font-size:12px;color:var(--fg);margin-top:.3rem">
                <input type="checkbox" data-cur="${i}" ${c.current?"checked":""}>現在参画中</label></div>
            ${fld("区分", c.careerType==="未経験"?"未経験":"経験者", {type:"select",options:["経験者","未経験"], bind:`careers.${i}.careerType`})}
            ${fld(c.careerType==="未経験"?"タイトル":"プロジェクト名", c.project, {wide:true, bind:`careers.${i}.project`})}
            ${fld("役割", c.role, {bind:`careers.${i}.role`})}
            ${fld("チーム人数", c.team, {type:"number", bind:`careers.${i}.team`})}
            ${fld("勤怠提出元", attendanceSourceLabel(c.attendanceSubmissionSource), {type:"select",options:["","上位会社","参画中メンバー"], bind:`careers.${i}.attendanceSubmissionSource`})}
            ${fld("使用環境", c.env, {bind:`careers.${i}.env`})}
            ${fld("使用技術", c.tech, {bind:`careers.${i}.tech`})}
            ${fld("業務内容", c.desc, {type:"textarea", wide:true, bind:`careers.${i}.desc`})}
          </div>
          <div style="margin-top:.9rem">
            <label style="font-size:11.5px;color:var(--fg-muted);font-weight:700;display:block;margin-bottom:.4rem">担当工程</label>
            <div class="taglist">${PHASES.map(p=>`
              <label class="tag ${c.phases.includes(p)?"":"gray"}" style="cursor:pointer;display:inline-flex;gap:.3rem;align-items:center">
                <input type="checkbox" data-ph="${i}" value="${esc(p)}" ${c.phases.includes(p)?"checked":""} style="margin:0">${esc(p)}</label>`).join("")}</div>
          </div>
          <div style="margin-top:.9rem">${fld("備考", c.remarks||"", {wide:true, bind:`careers.${i}.remarks`})}</div>
        </div>
      </div>`).join("")
    : `<div class="card"><div class="bd"><div class="empty">経歴が登録されていません。追加ボタンから登録してください。</div></div></div>`}`;

    $("#addCareer").onclick = () => {
      syncEditState();
      e.careers.unshift({start:"",end:"",current:false,careerType:"経験者",project:"",desc:"",role:"",team:1,attendanceSubmissionSource:"",env:"",tech:"",phases:[],remarks:""});
      renderTab(); toast("経験者の経歴を1件追加しました");
    };
    $("#addCareerInexperienced").onclick = () => {
      syncEditState();
      e.careers.unshift({start:"",end:"",current:false,careerType:"未経験",project:"",desc:"",role:"",team:1,attendanceSubmissionSource:"",env:"",tech:"",phases:[],remarks:""});
      renderTab(); toast("未経験の経歴を1件追加しました");
    };
    body.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{syncEditState();const i=+b.dataset.up;[e.careers[i-1],e.careers[i]]=[e.careers[i],e.careers[i-1]];renderTab();});
    body.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{syncEditState();const i=+b.dataset.down;[e.careers[i+1],e.careers[i]]=[e.careers[i],e.careers[i+1]];renderTab();});
    body.querySelectorAll("[data-dupc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dupc;
      syncEditState(); e.careers.splice(i+1,0,JSON.parse(JSON.stringify(e.careers[i])));renderTab();toast("経歴を複製しました");});
    body.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>{syncEditState();e.careers.splice(+b.dataset.delc,1);renderTab();toast("経歴を削除しました");});
    body.querySelectorAll("[data-cur]").forEach(cb=>cb.onchange=()=>{
      const i=+cb.dataset.cur;
      e.careers[i].current=cb.checked;
    });
    body.querySelectorAll("[data-ph]").forEach(cb=>cb.onchange=()=>{
      const i=+cb.dataset.ph, v=cb.value, ph=e.careers[i].phases;
      cb.checked ? (!ph.includes(v)&&ph.push(v)) : ph.splice(ph.indexOf(v),1);
    });
    return;
  }

  if(editTab === "pr"){
    body.innerHTML = `
    <div class="card"><div class="hd"><h2>自己PR</h2></div><div class="bd">
      <div class="note info"><p>MVPではリッチテキストエディタを利用せず、改行可能なテキスト形式とします。</p></div>
      <textarea class="ctl" style="min-height:280px" data-bind="pr">${esc(e.pr)}</textarea>
      <p style="font-size:11.5px;color:var(--fg-muted);margin:.4rem 0 0">${e.pr.length} 文字</p>
    </div></div>`;
  }
}

/* =========================================================
   ルーティング
   ========================================================= */
function go(nav){
  document.querySelectorAll(".side a.item").forEach(a=>a.classList.toggle("active", a.dataset.nav===nav));
  window.scrollTo(0,0);
  if(nav === "project-mail"){ screenProjectMailList(); }
  else if(nav === "staff-mail"){ screenStaffMailList(); }
  else if(nav === "skill-master"){ screenSkillMaster(); }
  else if(nav === "matching"){ screenMatchingList(); }
  else if(nav === "proposal"){ screenProposalList(); }
  else screenList();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-nav],[data-open],[data-edit],[data-new],[data-dup],[data-pdf],[data-match-open],[data-proposal-open],[data-member-tab],[data-proposal-create],[data-match-dismiss],[data-project-mail-open],[data-staff-mail-open],[data-member-new],[data-member-edit],[data-member-save],[data-mail-save],[data-matching-result],[data-mail-import-run],[data-mail-history],[data-dialog-close],[data-unknown-term],[data-skill-restore],[data-skill-decision-save],[data-skill-merge],[data-relink],[data-proposal-update],[data-snapshot-toggle],[data-webmail-open],[data-mail-body-toggle]");
  if(!t) return;
  if(t.dataset.nav){ ev.preventDefault(); go(t.dataset.nav); return; }
  ev.preventDefault();
  if(t.dataset.mailBodyToggle){ const body=t.parentElement.querySelector(".source-mail-body"); const expanded=!body.classList.contains("collapsed"); body.classList.toggle("collapsed",expanded); t.textContent=expanded?"本文をすべて表示":"本文を折りたたむ"; return; }
  if(t.dataset.webmailOpen){ toast("Webメールを開きます（モック）"); return; }
  window.scrollTo(0,0);
  if(t.dataset.mailImportRun){ toast("メール取り込みを開始しました。完了までしばらくお待ちください。"); return; }
  if(t.dataset.mailHistory){ openMailImportHistory(); return; }
  if(t.dataset.dialogClose){ t.closest(".dialog-backdrop")?.remove(); return; }
  if(t.dataset.skillRestore){ toast(`${t.dataset.skillRestore}を未対応に戻しました`); return; }
  if(t.dataset.unknownTerm){ openUnknownTermDecision(t.dataset.unknownTerm); return; }
  if(t.dataset.skillDecisionSave){ toast(`${t.dataset.skillDecisionSave}しました（モック）`); t.closest(".dialog-backdrop")?.remove(); return; }
  if(t.dataset.skillMerge){ toast(`${t.dataset.skillMerge}の統合先を選択します（モック）`); return; }
  if(t.dataset.relink){ toast("案件・要員のスキルを再照合しました（モック）"); return; }
  if(t.dataset.proposalUpdate){ toast("提案情報を更新しました（モック）"); t.disabled=true; return; }
  if(t.dataset.snapshotToggle){ const box=document.querySelector(`[data-snapshot="${t.dataset.snapshotToggle}"]`); box?.classList.toggle("hidden"); return; }
  if(t.dataset.projectMailOpen){ screenProjectMailDetail(+t.dataset.projectMailOpen); return; }
  if(t.dataset.staffMailOpen){ screenStaffMailDetail(+t.dataset.staffMailOpen); return; }
  if(t.dataset.memberNew){ screenMemberEdit(null); return; }
  if(t.dataset.memberEdit){ screenMemberEdit(+t.dataset.memberEdit); return; }
  if(t.dataset.memberSave){ toast("メンバー情報を保存しました（モック）"); setTimeout(()=>go("members"),450); return; }
  if(t.dataset.mailSave){ toast(`${t.dataset.mailSave}の抽出結果を保存しました（モック）`); return; }
  if(t.dataset.matchingResult){ screenMatchingResult(+t.dataset.matchingResult); return; }
  if(t.dataset.memberTab){ screenDetail(+t.dataset.memberId, t.dataset.memberTab); return; }
  if(t.dataset.matchOpen){ screenDetail(+t.dataset.matchOpen, "matching"); return; }
  if(t.dataset.proposalOpen){ screenDetail(+t.dataset.proposalOpen, "proposal"); return; }
  if(t.dataset.proposalCreate){ toast(t.dataset.proposalCreate==="candidate"?"メンバーに昇格して提案を作成します（モック）":"選択した案件メールから提案を作成します（モック）"); return; }
  if(t.dataset.matchDismiss){ toast("マッチングを見送りました（モック）"); return; }
  if(t.dataset.pdf){
    const printable = SHEETS.find(s=>s.id===+t.dataset.pdf);
    if(printable){
      $("#printSheet").innerHTML = renderPrintSheet(printable);
      document.body.classList.add("printing");
      toast("印刷ダイアログを開きます（PDF保存で出力）");
      setTimeout(()=>window.print(),400);
      setTimeout(()=>{document.body.classList.remove("printing"); $("#printSheet").innerHTML="";},1200);
    }
    return;
  }
  if(t.dataset.new){ screenEdit(null); return; }
  if(t.dataset.dup){ screenEdit(+t.dataset.dup, "dup"); return; }
  if(t.dataset.edit){ screenEdit(+t.dataset.edit); return; }
  if(t.dataset.open){ screenDetail(+t.dataset.open); return; }
});

document.addEventListener("input", ev => {
  if(editState && editState.id && ev.target.closest("[data-bind],[data-skill],[data-qual]")) scheduleDraftSave();
  const emp = ev.target.closest("[data-employee-code]");
  if(emp){
    const nextCode = toHalfWidth(emp.value).replace(/[^A-Za-z0-9-]/g, "").toUpperCase();
    if(emp.value !== nextCode) emp.value = nextCode;
  }
  const half = ev.target.closest("[data-halfwidth]");
  if(half){
    const nextHalf = toHalfWidth(half.value);
    if(half.value !== nextHalf) half.value = nextHalf;
  }
  const t = ev.target.closest("[data-date-format]");
  if(!t) return;
  const beforeDigits = toHalfWidth(t.value).replace(/\D/g, "").length;
  const next = formatDateValue(t.value, t.dataset.dateFormat);
  if(t.value !== next) t.value = next;
  if(t.dataset.careerEnd && editState?.careers){
    editState.careers[+t.dataset.careerEnd].end = normalizeDateValue(t.value);
  }
  const doneLength = t.dataset.dateFormat === "month" ? 6 : 8;
  const afterDigits = toHalfWidth(t.value).replace(/\D/g, "").length;
  if(beforeDigits >= doneLength && afterDigits >= doneLength){
    const validation = validateDateValue(t.value, t.dataset.dateFormat);
    if(!validation.ok){
      t.classList.add("invalid");
      toast(validation.message);
      t.focus();
      return;
    }
    const pairError = careerDatePairError(t);
    if(pairError){
      pairError.fields.forEach(el=>el.classList.add("invalid"));
      toast(pairError.message);
      t.focus();
      return;
    }
    t.classList.remove("invalid");
    t.closest(".career")?.querySelectorAll("[data-date-format]").forEach(el=>el.classList.remove("invalid"));
    const fields = [...document.querySelectorAll("input:not([type=hidden]):not(:disabled), select:not(:disabled), textarea:not(:disabled), button:not(:disabled)")];
    const nextField = fields[fields.indexOf(t) + 1];
    if(nextField) nextField.focus();
  }else{
    t.classList.remove("invalid");
  }
});

loadStoredSheets();
go("members");
</script>
</body>
</html>
