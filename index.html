<style>
:root{
  --primary:#1e5eb8; --primary-dark:#17488d; --primary-soft:#e8f0fb;
  --bg:#f4f6f9; --surface:#fff; --fg:#1f2328; --fg-muted:#5b6673;
  --border:#dfe3e8; --border-strong:#c4cbd4;
  --ok:#1a7f4b; --ok-soft:#e4f4ea; --warn:#a15c00; --warn-soft:#fdf3e2;
  --danger:#b3261e; --danger-soft:#fceceb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --shadow-lg:0 4px 12px rgba(16,24,40,.1);
  --radius:8px; --header-h:56px; --sidebar-w:232px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-size:14px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}

/* ---------- mock banner ---------- */
.mockbar{
  background:#2b3441;color:#e9edf2;font-size:12.5px;padding:.45rem 1rem;
  display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;
}
.mockbar strong{color:#ffd66b}
.mockbar a{color:#8fc0ff}

/* ---------- header ---------- */
header.appbar{
  position:sticky;top:0;z-index:30;height:var(--header-h);
  background:var(--primary);color:#fff;display:flex;align-items:center;
  padding:0 1.25rem;gap:1rem;box-shadow:var(--shadow);
}
.appbar .logo{font-weight:700;font-size:15.5px;letter-spacing:.02em;white-space:nowrap}
.appbar .logo span{opacity:.75;font-weight:400;font-size:12.5px;margin-left:.5rem}
.appbar .spacer{flex:1}
.appbar .user{display:flex;align-items:center;gap:.55rem;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - var(--header-h))}
nav.side{background:var(--surface);border-right:1px solid var(--border);padding:.85rem 0}
.side .grp{padding:.55rem 1.15rem .3rem;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--fg-muted)}
.side a.item{
  display:flex;align-items:center;gap:.65rem;padding:.55rem 1.15rem;
  color:var(--fg);text-decoration:none;font-size:13.5px;border-left:3px solid transparent;
}
.side a.item:hover{background:var(--bg)}
.side a.item.active{background:var(--primary-soft);border-left-color:var(--primary);color:var(--primary-dark);font-weight:600}
.side a.item.disabled{color:#a6aeb8;pointer-events:none}
.side .ico{width:18px;text-align:center;font-size:15px}
.side .badge{margin-left:auto;font-size:10.5px;background:var(--bg);border:1px solid var(--border);
  color:var(--fg-muted);padding:.05rem .4rem;border-radius:999px}

main{padding:1.25rem 1.75rem 4rem;min-width:0}
.crumb{font-size:12.5px;color:var(--fg-muted);margin-bottom:.7rem}
.crumb a{color:var(--fg-muted);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb span{margin:0 .4rem;opacity:.5}

.pagehead{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.15rem;flex-wrap:wrap}
.pagehead h1{font-size:20px;margin:0;line-height:1.4}
.pagehead .sub{font-size:12.5px;color:var(--fg-muted);margin:.15rem 0 0}
.pagehead .acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);
  padding:.42rem .9rem;border-radius:6px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:.4rem;transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--danger);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:.22rem .55rem;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:1.15rem;overflow:hidden}
.card>.hd{padding:.75rem 1.1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;background:#fafbfc}
.card>.hd h2{font-size:14px;margin:0;font-weight:700}
.card>.hd .acts{margin-left:auto;display:flex;gap:.4rem}
.card>.bd{padding:1.1rem}
.card>.bd.flush{padding:0}

/* ---------- filter bar ---------- */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field label{font-size:11.5px;color:var(--fg-muted);font-weight:600}
.ctl{
  border:1px solid var(--border-strong);border-radius:6px;padding:.4rem .6rem;
  background:var(--surface);font-size:13px;min-width:150px;
}
.ctl:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
textarea.ctl{min-height:110px;resize:vertical;width:100%;line-height:1.7}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:.6rem .85rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl th{background:#fafbfc;font-size:11.5px;color:var(--fg-muted);font-weight:700;
  letter-spacing:.03em;white-space:nowrap;position:sticky;top:0}
table.tbl tbody tr:hover{background:var(--primary-soft)}
table.tbl tbody tr{cursor:pointer}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.who{display:flex;align-items:center;gap:.6rem}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.who .nm{font-weight:600}
.who .kn{font-size:11px;color:var(--fg-muted);line-height:1.3}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;padding:.1rem .55rem;
  border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--fg-muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:#b7e0c6;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:#eccb95;color:var(--warn)}
.chip.pri{background:var(--primary-soft);border-color:#bcd5f2;color:var(--primary-dark)}
.taglist{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{font-size:12px;padding:.15rem .6rem;border-radius:5px;background:var(--primary-soft);
  color:var(--primary-dark);border:1px solid #cfe0f6;white-space:nowrap}
.tag .yr{opacity:.7;font-size:11px;margin-left:.25rem}
.tag.gray{background:var(--bg);border-color:var(--border);color:var(--fg-muted)}

/* ---------- definition grid ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 1.5rem}
.dl .row{display:grid;grid-template-columns:8.5rem 1fr;gap:.5rem;padding:.42rem 0;border-bottom:1px dashed var(--border);font-size:13px}
.dl .row dt{color:var(--fg-muted);font-size:12px;margin:0}
.dl .row dd{margin:0;word-break:break-word}
.calc{font-size:10.5px;color:var(--ok);background:var(--ok-soft);border:1px solid #b7e0c6;
  padding:0 .3rem;border-radius:3px;margin-left:.35rem;vertical-align:1px}

/* ---------- career ---------- */
.career{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.9rem;background:var(--surface)}
.career>.top{display:flex;align-items:center;gap:.7rem;padding:.65rem .9rem;background:#fafbfc;border-bottom:1px solid var(--border);flex-wrap:wrap}
.career .no{width:22px;height:22px;border-radius:5px;background:var(--primary);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.career .term{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--fg-muted);white-space:nowrap}
.career .pjname{font-weight:700;font-size:13.5px}
.career .top .acts{margin-left:auto;display:flex;gap:.3rem}
.career>.bd{padding:.85rem .9rem}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:.15rem;border-bottom:1px solid var(--border);margin-bottom:1.15rem;overflow-x:auto}
.tabs button{
  border:none;background:none;padding:.65rem 1.1rem;font-size:13.5px;color:var(--fg-muted);
  border-bottom:2px solid transparent;font-weight:500;white-space:nowrap;
}
.tabs button:hover{color:var(--fg);background:var(--bg)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;gap:.5rem;margin-bottom:1.4rem;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:.5rem;font-size:12.5px;color:var(--fg-muted)}
.step .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--surface)}
.step.active{color:var(--primary-dark);font-weight:700}
.step.active .dot{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done{color:var(--ok)}
.stepline{flex:1;height:1px;background:var(--border-strong);min-width:18px;max-width:56px}

.drop{
  border:2px dashed var(--border-strong);border-radius:var(--radius);padding:2.4rem 1rem;
  text-align:center;background:#fafbfc;color:var(--fg-muted);
}
.drop .big{font-size:28px;margin-bottom:.4rem}
.drop strong{color:var(--fg)}

/* ---------- notes ---------- */
.note{border-radius:6px;padding:.65rem .9rem;font-size:12.5px;margin-bottom:1rem;border:1px solid}
.note.info{background:var(--primary-soft);border-color:#bcd5f2;color:var(--primary-dark)}
.note.warn{background:var(--warn-soft);border-color:#eccb95;color:var(--warn)}
.note p{margin:0}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--fg-muted);font-size:13px}
.pager{display:flex;align-items:center;gap:.5rem;padding:.7rem 1.1rem;font-size:12.5px;color:var(--fg-muted);border-top:1px solid var(--border)}
.pager .spacer{flex:1}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.85;margin:0}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);
  background:#2b3441;color:#fff;padding:.6rem 1.1rem;border-radius:6px;font-size:13px;
  box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hidden{display:none !important}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:.4rem}
  .side .grp{display:none}
  .side a.item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:.5rem .8rem}
  .side a.item.active{border-left:none;border-bottom-color:var(--primary)}
  .side .badge{display:none}
  main{padding:1rem}
}
@media print{
  .mockbar,header.appbar,nav.side,.pagehead .acts,.crumb,.card>.hd .acts{display:none !important}
  .shell{grid-template-columns:1fr}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

const $ = s => document.querySelector(s);
const main = $("#main");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 要件: 年齢はDBに保存せず生年月日から算出する */
function calcAge(birth){
  const b = new Date(birth), t = new Date("2026-08-03");
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function months2y(m){
  const y = Math.floor(m/12), r = m%12;
  return r ? `${y}年${r}ヶ月` : `${y}年`;
}
/* 経験年数: 最も古い経歴の開始からの通算 */
function totalYears(s){
  if(!s.careers.length) return "—";
  const oldest = s.careers.map(c=>c.start).sort()[0];
  const [y,m] = oldest.split("-").map(Number);
  const mm = (2026 - y) * 12 + (8 - m);
  return months2y(mm);
}
function topSkills(s, n=3){ return s.skills.slice(0,n).map(k=>k.name); }
function initial(name){ return name.replace(/\s/g,"").charAt(0); }
function term(c){ return `${c.start.replace("-","/")} 〜 ${c.current ? "現在" : c.end.replace("-","/")}`; }
function statusChip(st){
  if(st.startsWith("待機")) return `<span class="chip ok">${esc(st)}</span>`;
  if(st.startsWith("稼働中（")) return `<span class="chip warn">${esc(st)}</span>`;
  return `<span class="chip">${esc(st)}</span>`;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function crumb(items){
  return `<div class="crumb">` + items.map((it,i)=>
    (i ? `<span>›</span>` : "") + (it.nav ? `<a href="#" data-nav="${it.nav}">${esc(it.label)}</a>` : esc(it.label))
  ).join("") + `</div>`;
}

  opt = opt || {};

  if(opt.type === "textarea")
    return `<div class="field" style="${w}"><label>${esc(label)}</label><textarea class="ctl">${esc(val)}</textarea></div>`;
  if(opt.type === "select")
    return `<div class="field" style="${w}"><label>${esc(label)}</label><select class="ctl" style="width:100%">
      ${opt.options.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  return `<div class="field" style="${w}"><label>${esc(label)}</label>
    <input class="ctl" style="width:100%" type="${opt.type||"text"}" value="${esc(val)}" placeholder="${esc(opt.ph||"")}"></div>`;
}

/* =========================================================
   ルーティング
   ========================================================= */
function go(nav){
  document.querySelectorAll(".side a.item").forEach(a=>a.classList.toggle("active", a.dataset.nav===nav));
  window.scrollTo(0,0);
  if(nav === "import"){ importStep = 1; screenImport(); }
  else screenList();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-nav],[data-open],[data-edit],[data-new],[data-dup],[data-pdf]");
  if(!t) return;
  if(t.dataset.nav){ ev.preventDefault(); go(t.dataset.nav); return; }
  ev.preventDefault();
  window.scrollTo(0,0);
  if(t.dataset.pdf){ toast("印刷ダイアログを開きます（PDF保存で出力）"); setTimeout(()=>window.print(),400); return; }
  if(t.dataset.new){ screenEdit(null); return; }
  if(t.dataset.dup){ screenEdit(+t.dataset.dup, "dup"); return; }
  if(t.dataset.edit){ screenEdit(+t.dataset.edit); return; }
  if(t.dataset.open){ screenDetail(+t.dataset.open); return; }
});

go("list");
